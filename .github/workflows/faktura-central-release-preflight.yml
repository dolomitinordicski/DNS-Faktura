name: Faktura central release preflight

on:
  pull_request:
    branches: [main]
    paths:
      - 'release/central-functions-contract.json'
      - 'scripts/verify-central-release.mjs'
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/faktura-central-release-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate central release contract (offline)
        run: |
          node --check functions/src/index.mjs
          node --check scripts/verify-central-release.mjs
          node scripts/verify-central-release.mjs
