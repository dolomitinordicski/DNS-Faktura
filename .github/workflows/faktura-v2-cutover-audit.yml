name: Faktura v2 production cutover audit

on:
  push:
    branches:
      - refactor/faktura-v2-domain
    paths:
      - 'functions/scripts/cutover-audit.mjs'
      - '.github/workflows/faktura-v2-cutover-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DNS_CORE }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Firebase credentials
        shell: bash
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_DNS_CORE repository secret."
            exit 1
          fi
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated audit dependencies
        run: npm --prefix functions install --ignore-scripts
      - name: Read-only structural cutover audit
        run: node functions/scripts/cutover-audit.mjs --season=2026-27 --fail-on-blockers
        env:
          GOOGLE_CLOUD_PROJECT: dns-core
