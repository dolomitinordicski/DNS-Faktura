name: Faktura v2 domain scenarios

on:
  push:
    branches:
      - refactor/faktura-v2-domain
    paths:
      - 'src/v2/**'
      - 'docs/faktura-v2/**'
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/faktura-v2-domain-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenarios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Faktura v2 domain scenarios
        run: npx --yes tsx src/v2/tests/runScenarios.ts
      - name: Install public Functions dependencies
        run: npm --prefix functions install --ignore-scripts
      - name: Validate public Functions syntax
        run: node --check functions/src/index.mjs
