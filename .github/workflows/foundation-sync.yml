name: DNS Foundation pin and update

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [dns-foundation-release]
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: foundation-sync-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-pin:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require an immutable Foundation release tag
        run: >
          node --input-type=module -e "
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const dep = pkg.dependencies?.['@dolomitinordicski/dns-shared-data']
            ?? pkg.devDependencies?.['@dolomitinordicski/dns-shared-data'];
          const tag = dep?.split('#').at(-1) ?? '';
          const version = tag.startsWith('foundation-v') ? tag.slice('foundation-v'.length) : '';
          const parts = version.split('.');
          const numeric = value => value.length > 0 && [...value].every(char => char >= '0' && char <= '9');
          if (parts.length !== 3 || parts.some(part => !numeric(part))) {
            throw new Error('Foundation must be pinned to an immutable foundation-vX.Y.Z tag; found: ' + (dep ?? 'no dependency'));
          }
          "

  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read latest stable Foundation release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            node --input-type=module -e "import fs from 'node:fs'; const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')); const tag = event.client_payload?.tag ?? ''; fs.writeFileSync(process.env.RUNNER_TEMP + '/foundation-release.json', JSON.stringify({ tag_name: tag }));"
          else
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/dolomitinordicski/dns-shared-data/releases/latest \
              -o "$RUNNER_TEMP/foundation-release.json"
          fi
          node --input-type=module -e "import fs from 'node:fs'; const release = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/foundation-release.json', 'utf8')); const tag = release.tag_name ?? ''; const version = tag.startsWith('foundation-v') ? tag.slice('foundation-v'.length) : ''; const parts = version.split('.'); const numeric = value => value.length > 0 && [...value].every(char => char >= '0' && char <= '9'); if (parts.length !== 3 || parts.some(part => !numeric(part))) throw new Error('Unexpected DNS Foundation release tag: ' + (tag || '(empty)')); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); const key = '@dolomitinordicski/dns-shared-data'; const current = pkg.dependencies?.[key] ?? pkg.devDependencies?.[key] ?? ''; const target = 'github:dolomitinordicski/dns-shared-data#' + tag; console.log('tag=' + tag); console.log('needs_update=' + (current === target ? 'false' : 'true'));" >> "$GITHUB_OUTPUT"

      - name: Update Foundation dependency
        if: steps.latest.outputs.needs_update == 'true'
        env:
          FOUNDATION_TAG: ${{ steps.latest.outputs.tag }}
        run: >
          node --input-type=module -e "
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const key = '@dolomitinordicski/dns-shared-data';
          const section = pkg.dependencies?.[key] !== undefined ? 'dependencies' : 'devDependencies';
          if (pkg[section]?.[key] === undefined) throw new Error('Missing ' + key + ' in package.json');
          pkg[section][key] = 'github:dolomitinordicski/dns-shared-data#' + process.env.FOUNDATION_TAG;
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\\n');
          "

      - name: Bump consumer patch version
        if: steps.latest.outputs.needs_update == 'true'
        run: >
          node --input-type=module -e "
          import fs from 'node:fs';
          const pkgPath = 'package.json';
          const lockPath = 'package-lock.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          const parts = String(pkg.version ?? '').split('.');
          const numeric = value => value.length > 0 && [...value].every(char => char >= '0' && char <= '9');
          if (parts.length !== 3 || parts.some(part => !numeric(part))) throw new Error('App version must use plain SemVer X.Y.Z; found: ' + (pkg.version ?? '(empty)'));
          parts[2] = String(Number(parts[2]) + 1);
          pkg.version = parts.join('.');
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\\n');
          if (fs.existsSync(lockPath)) {
            const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
            lock.version = pkg.version;
            if (lock.packages?.['']) lock.packages[''].version = pkg.version;
            fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + '\\n');
          }
          console.log('Consumer app version -> ' + pkg.version);
          "

      - name: Install and run consumer checks
        if: steps.latest.outputs.needs_update == 'true'
        run: |
          npm install
          if node -e "process.exit(require('./package.json').scripts?.validate ? 0 : 1)"; then
            npm run validate
          else
            npm run build
          fi
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          fi
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          fi

      - name: Open or refresh Foundation update PR
        if: steps.latest.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/foundation-update
          delete-branch: false
          add-paths: package.json, package-lock.json
          commit-message: "chore: update DNS Foundation to ${{ steps.latest.outputs.tag }}"
          title: "chore: update DNS Foundation to ${{ steps.latest.outputs.tag }}"
          body: |
            Automated dependency update from the latest stable DNS Foundation release.

            The consumer app patch version is bumped automatically so Hub can track the deployed application build independently from Foundation.

            The consumer install and available validation/build checks passed before this PR was opened.
            Review the visible UI and merge when ready. Tool-owned domain and calculation logic is not changed.
