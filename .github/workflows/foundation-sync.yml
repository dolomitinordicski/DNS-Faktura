name: DNS Foundation pin and update

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [dns-foundation-release]
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "scripts/foundation-lock*.mjs"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "scripts/foundation-lock*.mjs"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: foundation-sync-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-pin:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test stale-lock regression protection
        run: node --test scripts/foundation-lock.test.mjs
      - name: Verify manifest, lockfile version and exact release commit
        run: node scripts/foundation-lock.mjs
      - name: Install exactly the committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Verify installed Foundation
        run: node scripts/foundation-lock.mjs --installed
      - name: Run consumer checks
        run: |
          if node -e "process.exit(require('./package.json').scripts?.validate ? 0 : 1)"; then
            npm run validate
          else
            npm run build
          fi
          npm run test --if-present
          npm run lint --if-present

  update:
    if: github.event_name != 'pull_request' && github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate Foundation lock entry, including stale same-tag locks
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          FOUNDATION_TAG: ${{ github.event.client_payload.tag }}
        run: node scripts/foundation-lock.mjs --update
      - name: Clean install and verify exact Foundation release
        if: steps.latest.outputs.needs_update == 'true'
        run: |
          npm ci --no-audit --no-fund
          node --test scripts/foundation-lock.test.mjs
          node scripts/foundation-lock.mjs --installed
      - name: Run consumer checks
        if: steps.latest.outputs.needs_update == 'true'
        run: |
          if node -e "process.exit(require('./package.json').scripts?.validate ? 0 : 1)"; then
            npm run validate
          else
            npm run build
          fi
          npm run test --if-present
          npm run lint --if-present
      - name: Open or refresh verified Foundation update PR
        if: steps.latest.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/foundation-update
          delete-branch: false
          add-paths: |
            package.json
            package-lock.json
          commit-message: "chore: update DNS Foundation to ${{ steps.latest.outputs.tag }}"
          title: "chore: update DNS Foundation to ${{ steps.latest.outputs.tag }}"
          body: |
            Updates the Foundation manifest and regenerates its npm lock entry.
            Verifies the release tag's dereferenced commit, locked version, and installed package.
            A clean npm ci and consumer validation/build, test and lint scripts passed before this PR was opened.
            Also repairs stale locks when package.json already declares the target release.
            The consumer patch version is bumped for deployment tracking.
