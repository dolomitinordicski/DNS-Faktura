name: DNS Foundation pin and update
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/foundation-sync.yml"
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: foundation-sync-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-pin:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require an immutable Foundation release tag
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const dep = pkg.dependencies?.['@dolomitinordicski/dns-shared-data']
            ?? pkg.devDependencies?.['@dolomitinordicski/dns-shared-data'];
          if (!/^github:dolomitinordicski\\/dns-shared-data#foundation-v\\d+\\.\\d+\\.\\d+$/.test(dep ?? '')) {
            throw new Error(`Foundation must be pinned to an immutable foundation-vX.Y.Z tag; found: ${dep ?? 'no dependency'}`);
          }
          NODE
  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read latest stable Foundation release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/dolomitinordicski/dns-shared-data/releases/latest \
            -o "$RUNNER_TEMP/foundation-release.json"
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          const release = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/foundation-release.json', 'utf8'));
          const tag = release.tag_name ?? '';
          if (!/^foundation-v\\d+\\.\\d+\\.\\d+$/.test(tag)) {
            throw new Error(`Unexpected DNS Foundation release tag: ${tag || '(empty)'}`);
          }
          console.log(`tag=${tag}`);
          NODE
      - name: Update Foundation dependency
        env:
          FOUNDATION_TAG: ${{ steps.latest.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const key = '@dolomitinordicski/dns-shared-data';
          const section = pkg.dependencies?.[key] !== undefined ? 'dependencies' : 'devDependencies';
          if (pkg[section]?.[key] === undefined) throw new Error(`Missing ${key} in package.json`);
          pkg[section][key] = `github:dolomitinordicski/dns-shared-data#${process.env.FOUNDATION_TAG}`;
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\\n');
          NODE
      - name: Install and run consumer checks
        run: |
          npm install
          if node -e "process.exit(require('./package.json').scripts?.validate ? 0 : 1)"; then
            npm run validate
          else
            npm run build
          fi
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          fi
          if node -e "process.exit(require('./package.json').scripts?.lint ? 0 : 1)"; then
            npm run lint
          fi
      - name: Open or refresh Foundation update PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/foundation-update
          delete-branch: false
          add-paths: package.json
          commit-message: "chore: update DNS Foundation to ${{ steps.latest.outputs.tag }}"
          title: "chore: update DNS Foundation to ${{ steps.latest.outputs.tag }}"
          body: |
            Automated dependency update from the latest stable DNS Foundation release.

            The consumer install and available validation/build checks passed before this PR was opened.
            Review the visible UI and merge when ready. Tool-owned domain and calculation logic is not changed.
          labels: |
            dependencies
